        <!--
          作品を追加するときは、下のテンプレートのどちらかをコピーして
          このコメントの下に貼り付け、中身を書き換えてください。

          【深掘り型】受賞歴や制作背景など、しっかり語れる作品向け
          <section class="work-detail-section">
            <h2>作品タイトル</h2>
            <div class="work-thumb work-detail-thumb">作品画像(準備中)</div>
            <p>作品の説明文。制作の背景や工夫した点、受賞歴などがあれば書く。</p>
            <p class="work-meta">使用ソフト：CLIP STUDIO PAINT / Adobe Photoshop CC</p>
            <p><a href="#" class="button secondary" target="_blank" rel="noopener">詳細を見る</a></p>
          </section>

          【ライト型】画像と一言だけで十分な、軽めの作品向け
          <section class="work-detail-section">
            <h2>作品タイトル</h2>
            <div class="work-thumb work-detail-thumb">作品画像(準備中)</div>
            <p class="work-meta">使用ソフト：CLIP STUDIO PAINT</p>
          </section>

          ※ライト型は説明文(<p>)とリンクボタンを省略した形。
            必要なら1行だけ<p>で説明を足してもOK。
            外部リンクが無ければ、<p><a>...</a></p>の行ごと削除する。
