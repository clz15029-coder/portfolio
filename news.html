        <section class="page-header">
          <p class="page-eyebrow">NEWS</p>
          <h1>お知らせ</h1>
        </section>

        <!--
          お知らせを追加するときは、下のテンプレートをコピーして
          .faq-listの中(一番上、最新のものが上に来るように)に貼り付けてください。
          FAQページと同じ部品(.faq-item等)を使っているので、クリックで開閉します。

          <div class="faq-item">
            <button type="button" class="faq-question" aria-expanded="false">
              <span class="faq-question-text">
                <span class="news-date">YYYY.MM.DD</span>
                <span>見出しをここに書く</span>
              </span>
              <span class="faq-icon" aria-hidden="true"></span>
            </button>
            <div class="faq-answer">
              <div class="faq-answer-inner">
                <p>本文をここに書く。</p>
              </div>
            </div>
          </div>
        -->

        <div class="faq-list">
          <div class="faq-item">
            <button type="button" class="faq-question" aria-expanded="false">
              <span class="faq-question-text">
                <span class="news-date">2026.08.20</span>
                <span>ポートフォリオサイトを更新しました</span>
              </span>
              <span class="faq-icon" aria-hidden="true"></span>
            </button>
            <div class="faq-answer">
              <div class="faq-answer-inner">
                <p>WORKS・ABOUT・FAQなど各ページを継続的に更新しています。今後も制作実績や記事を随時追加していきます。</p>
              </div>
            </div>
          </div>
        </div>
